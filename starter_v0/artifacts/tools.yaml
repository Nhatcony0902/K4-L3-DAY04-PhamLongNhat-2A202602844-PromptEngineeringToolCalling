# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# Keep built-in names and supplied evaluation cases unchanged.
# Improve descriptions and compatible schemas. Declare team-built bonus tools
# here and in tools/__init__.py, then test them with team-authored cases.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: search_kb
    description: "Tìm bài hướng dẫn khắc phục trong knowledge base nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm, có thể gồm hệ điều hành hoặc triệu chứng"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn. Khi yêu cầu nói tới một chủ đề cụ thể (VPN, Wi-Fi, email, máy in...), đặt đúng nhóm đó; chỉ dùng all khi không xác định được chủ đề."}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái một dịch vụ."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường. Chỉ có production và staging. Nếu người dùng nêu một môi trường khác (demo, test, dev, QA...), không tự quy đổi: gọi clarify với response_type choice và options [production, staging]."}
      required: [service]

  - name: inspect_device
    description: "Kiểm tra thông tin và chẩn đoán một thiết bị cụ thể theo asset ID."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản do người dùng cung cấp, dạng tiền tố thiết bị + số (ví dụ LT-204, DT-031). Không bao giờ truyền employee ID (EMP-...), tên, phòng ban hay từ chung như 'laptop'."}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Nhóm kiểm tra khớp với sự cố được nêu: VPN → vpn, Wi-Fi/mạng → network, mã hóa/bảo mật → security, ổ đĩa/pin → hardware, ứng dụng/driver → software. Chỉ dùng all khi không nêu sự cố cụ thể."}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu tài khoản nhân viên trong danh bạ hỗ trợ; kết quả đã gồm trạng thái tài khoản, MFA và danh sách thiết bị được cấp (assigned_assets). Dùng tool này khi hỏi về thiết bị được cấp của một nhân viên, không cần gọi inspect_device."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên do người dùng cung cấp, dạng EMP-xxxx. Không truyền tên, phòng ban hay asset ID."}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã có thành báo cáo."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Tạo một ticket hỗ trợ."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Đã được người dùng xác nhận"}
      required: [summary]

  # ---------------- Team-built bonus tool ----------------
  - name: request_account_unlock
    description: "Gửi yêu cầu mở khóa tài khoản đang bị khóa (write action). Chỉ dùng cho account_status locked; kiểm tra trạng thái bằng lookup_user nếu chưa biết. Không đổi mật khẩu, không mở khóa ngay: tạo hồ sơ chờ xác minh. Phải hỏi xác nhận payload bằng clarify yes_no trước khi đặt confirmed=true."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên do người dùng cung cấp, dạng EMP-xxxx."}
        verification_method: {type: string, enum: [manager_approval, service_desk_callback, in_person_badge], description: "Cách xác minh danh tính đã được phê duyệt. Nếu người dùng chưa nêu, gọi clarify với response_type choice và options là ba giá trị này. Mật khẩu, mã MFA/OTP hay mã khôi phục không bao giờ là cách xác minh."}
        reason: {type: string, default: "", description: "Mô tả ngắn lý do bị khóa. Không bao giờ chứa mật khẩu, mã MFA/OTP hay mã khôi phục."}
        confirmed: {type: boolean, default: false, description: "Chỉ true khi lượt mới nhất của người dùng xác nhận rõ ràng đúng payload (employee_id, verification_method, reason)."}
      required: [employee_id, verification_method]
